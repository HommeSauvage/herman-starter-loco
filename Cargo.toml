[workspace]

[package]
name = "herman-loco-starter"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "herman_loco_starter-cli"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
loco-rs = { version = "1.2" }

[dependencies]
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8" }
tracing = { version = "0.1" }
regex = { version = "1.11" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
# The `Validate` derive (re-exported by Loco) expands to `validator::...`
# paths, so the crate has to be a direct dependency.
validator = { version = "0.20" }
uuid = { version = "1.6", features = ["v4"] }
# ts-rs derives the TypeScript bindings for the `dtos` (the typed JSON API
# contract). Present for every db app; the SPA frontend consumes the exports,
# and a headless app can still emit them for external consumers.
ts-rs = { version = "12", features = ["chrono-impl", "serde-compat"] }
include_dir = { version = "0.7" }

[[bin]]
name = "herman_loco_starter-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { version = "3.1.1" }
rstest = { version = "0.25" }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }

# Debug info is the biggest contributor to target/ size. Our own crate keeps
# line tables (readable panics); dependencies do not need DWARF for day-to-day
# work, and dropping theirs cuts both the cache and link time.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

# Deploy artifacts are single binaries: optimize for size and runtime.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[package.metadata.cargo-machete]
# Both are used only through macros/derives that machete cannot see:
# `include_dir!` in src/mailers/auth.rs and `#[derive(Validate)]`, which expands
# to `validator::` paths.
ignored = ["include_dir", "validator"]
