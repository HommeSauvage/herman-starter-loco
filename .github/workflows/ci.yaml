name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# A newer push to the same ref makes the older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned, not `stable`. A new stable can add lints that turn `-D warnings`
  # red without anyone changing this repo. Bump this together with
  # rust-toolchain.toml, deliberately, with a green run on the new version.
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TERM_COLOR: always
  # CI never debugs a binary and never reuses incremental artifacts between
  # runs: dropping debuginfo shrinks target/ and speeds up every link step.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      # Restores ~/.cargo and target/. The key follows Cargo.lock, the
      # toolchain and .cargo/config.toml, so a dependency change invalidates it.
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # sccache survives what rust-cache's key cannot: a dependency bump or a
      # toolchain change that invalidates target/, while most crates are
      # unchanged. On a warm target cache it would never be asked to compile
      # and only adds setup/teardown time, so it is conditional on the miss.
      - name: Setup sccache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Enable sccache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"

      - name: Unused dependencies
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

      - run: cargo fmt --all -- --check

      - run: cargo clippy --locked --all-targets -- -D warnings

      - run: cargo test --locked

      # cargo test exports the ts-rs bindings. A diff here means a DTO changed
      # without the generated TypeScript being committed.
      - name: Bindings drift
        run: git diff --exit-code -- frontend/src/bindings

      - name: Docs
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: >-
            -D rustdoc::broken_intra_doc_links
            -D rustdoc::invalid_html_tags

      - name: sccache stats
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        run: sccache --show-stats

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # setup-bun caches the binary, not packages.
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run build

  # Main only: the deploy path must compile, even though PRs do not need to
  # pay for a second profile. Reports the artifact size the deploy docs quote.
  release:
    name: Release build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo build --release --locked

      - name: Report binary
        run: ls -lh target/release/*-cli
